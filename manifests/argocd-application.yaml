apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: python-cicd-app
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/NIHAL2175/python-cicd-pipeline.git
    targetRevision: main
    path: manifests

  destination:
    server: https://kubernetes.default.svc
    namespace: python-cicd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true